# Robi vhost for the shared edge proxy. Source of truth: /opt/robi/deploy/edge-robi.conf,
# installed as /opt/edge/conf.d/robi.conf. Upstream: alias `robi-web` on docker network `edge`.

limit_req_zone $binary_remote_addr zone=robi_web:10m rate=20r/s;

server {
    listen 80;
    server_name robi.panbias.com.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name robi.panbias.com.ar;

    ssl_certificate /etc/letsencrypt/live/robi.panbias.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robi.panbias.com.ar/privkey.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        limit_req zone=robi_web burst=40 nodelay;

        # `set` + resolver: re-resolves the upstream at runtime (see edge.md).
        set $upstream "robi-web:8080";
        proxy_pass http://$upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
