server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /robi-config.js { add_header Cache-Control "no-cache"; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
